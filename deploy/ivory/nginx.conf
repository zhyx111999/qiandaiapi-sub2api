map $http_upgrade $ivory_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The unchanged Sub2API backend enforces its own request-size policy.
    client_max_body_size 0;

    # Sign-up is GitHub-only: registration stays open for the OAuth account flow
    # (/api/v1/auth/oauth/pending/create-account), while e-mail/password sign-up is refused here.
    location = /api/v1/auth/register {
        default_type "application/json; charset=utf-8";
        return 403 '{"code":403,"reason":"PASSWORD_REGISTRATION_DISABLED","message":"账号密码注册已关闭，请使用 GitHub 登录 / Password sign-up is disabled, please continue with GitHub"}';
    }

    # Yezi daily check-in sidecar (extensions/checkin). Resolved per request, so
    # nginx still starts without it and the console simply hides the check-in card.
    location ^~ /api/v1/ext/checkin {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $yezi_checkin http://checkin:8080;
        proxy_pass $yezi_checkin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|setup|v1|v1beta|openai|anthropic|gemini|grok)(/|$) {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ivory_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://sub2api:8080;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The normal Vue router handles /home, /login, /model-plaza and console routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
