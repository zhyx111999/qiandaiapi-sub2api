# Real, isolated application for the ivory frontend. No mock API or production data.
# Build the normal frontend first (pnpm build), then copy .env.example to .env,
# fill secrets and run docker compose up -d. build:preview is NOT an app build.
name: laoliapi-ivory

services:
  web:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${IVORY_WEB_PORT:-18218}:80"
    volumes:
      - ../../backend/internal/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sub2api:
        condition: service_healthy

  sub2api:
    image: ghcr.io/ranxi2001/sub2api:2.18.1
    ports:
      - "127.0.0.1:${IVORY_BACKEND_PORT:-18217}:8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      # The web container (and the host proxy via the Docker gateway) sit in front:
      # trust private Docker hops so signup quotas / login bans use the real client IP.
      SERVER_TRUSTED_PROXIES: "127.0.0.1,::1,172.16.0.0/12"
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
      TZ: Asia/Shanghai
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # Yezi daily check-in sidecar. Talks to sub2api over its public API with the
  # official Admin API Key and keeps its own data in the yezi_checkin schema.
  # Removing this service leaves the official backend and console untouched.
  checkin:
    build: ../../extensions/checkin
    image: yezi-checkin:local
    restart: unless-stopped
    environment:
      SUB2API_URL: http://sub2api:8080
      SUB2API_ADMIN_API_KEY: ${CHECKIN_ADMIN_API_KEY:?Set CHECKIN_ADMIN_API_KEY in .env}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: sub2api
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: sub2api
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sub2api
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sub2api -d sub2api"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app-data:
  postgres-data:
  redis-data:
